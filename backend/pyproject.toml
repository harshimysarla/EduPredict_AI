[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edupredict-backend"
version = "1.0.0"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.vercel]
entrypoint = "app.main:app"
