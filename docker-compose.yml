# Docker Compose for EduPredict AI (reference)
#
# Note: the default local dev flow does NOT use Docker (see README). This
# compose file packages the stack for container-based deployments.
#
# After first start, seed the database:
#   docker compose exec backend python scripts/seed_database.py

services:
  db:
    image: postgres:16-alpine
    container_name: edupredict-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edupredict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edupredict"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edupredict-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/edupredict
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edupredict-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
